# Guard drop-in (spec §4.2): k3s never runs without the k3s_guard host firewall loaded.
# Installed as k3s.service.d/10-guard.conf on k3s-cp (server-bootstrap.sh) and as
# k3s-agent.service.d/10-guard.conf on every agent (node-bootstrap.sh).
[Unit]
Requires=k3s-guard.service
After=k3s-guard.service
