vm.panic_on_oom=0
vm.overcommit_memory=1
kernel.panic=10
kernel.panic_on_oops=1
# IP forwarding is required for Pod traffic. GCE's /etc/sysctl.d/60-gce-network-security.conf sets
# net.ipv4.ip_forward=0 and k3s turns forwarding on only when it starts, so a later `sysctl --system`
# (a re-run of the bootstrap) or the next boot would switch it off; this file sorts after it and wins.
# This deliberately overrides that hardening default: with ip_forward=1 the host routes on every
# interface, not only for the Pod network (the FORWARD policy stays ACCEPT; only the k3s/flannel rules
# and the guard's Pod-to-metadata drop shape it). On GCP the backstop is the instances'
# can_ip_forward=false (GCE drops packets with a foreign source or destination); Lambda has none
# (a residual risk in the threat model). The settings below carry over only the redirect and
# source-route parts of 60-gce's router hardening, for hosts that do not ship that file (Lambda).
net.ipv4.ip_forward=1
net.ipv4.conf.all.forwarding=1
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
