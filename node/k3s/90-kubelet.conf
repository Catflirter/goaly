vm.panic_on_oom=0
vm.overcommit_memory=1
kernel.panic=10
kernel.panic_on_oops=1
# IP forwarding is required for Pod traffic. GCE's /etc/sysctl.d/60-gce-network-security.conf sets
# net.ipv4.ip_forward=0 and k3s turns forwarding on only when it starts, so a later `sysctl --system`
# (a re-run of the bootstrap) or the next boot would switch it off; this file sorts after it and wins.
# This deliberately overrides that hardening default. On GCP the compensating control is the
# instances' can_ip_forward=false (GCE drops packets with a foreign source or destination); on every
# node the host stays a router only for the Pod network, and the settings below keep the rest of the
# 60-gce router hardening on hosts that do not ship that file (Lambda).
net.ipv4.ip_forward=1
net.ipv4.conf.all.forwarding=1
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
