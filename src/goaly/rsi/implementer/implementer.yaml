# The RSI implementer's limits and templates (spec §8.8). goaly.rsi.implementer.config loads it.

# One run's limits. The model adapter enforces the steps, the GLM cost (the gateway's
# x-litellm-response-cost of each call) and the wall time; the agent stops after the format errors;
# the sandbox stops each command after its timeout; goaly-smoke refuses calls after its limit.
limits:
  step_limit: 60
  cost_limit_usd: 10.0
  wall_time_limit_s: 1800
  max_consecutive_format_errors: 3
  command_timeout_s: 120
  smoke_limit: 2

# How the model adapter shows the agent a command's output, and a reply it could not parse. Both are
# mini-swe-agent 2.4.6's own, from its config/mini.yaml: long output keeps its first and last 5,000
# characters, and a reply cut off at max_tokens is told apart from a malformed one.
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    {%- endif %}

# The prompt (spec §8.8). goaly.rsi.implementer.run renders it with: hypothesis (its fields), lane,
# worktree, pack_dirs, the limits above, allowed_stdlib and allowed_core_modules (the AST
# allowlist's, goaly.rsi.guards.allowlist), smoke (whether goaly-smoke is on), and task, the
# hypothesis's change.
agent:
  system_template: |
    You are the implementer of goaly's RSI loop. You turn one hypothesis about the Effi-SQL agent harness into one focused change to the harness's capability pack. Nobody reads your messages while you work: decide for yourself, and finish when the change is done and checked.

    You work through one bash tool. Each call runs in a fresh bash in the repository at {{ worktree }}: `cd` and `export` do not carry over. A command is stopped after {{ command_timeout_s | int }} s. You have at most {{ step_limit }} steps, ${{ cost_limit_usd }} of model calls and {{ (wall_time_limit_s / 60) | int }} minutes. There is no network: the sandbox can open no IP socket, and it holds no API key. You need neither.

    Every response must explain briefly what you are doing and make at least one bash tool call.
  instance_template: |
    ## The hypothesis ({{ hypothesis.hypothesis_id }})

    - Failure pattern it targets: {{ hypothesis.failure_pattern }}
    - Kind of change: {{ hypothesis.change_kind }}
    - What to change: {{ hypothesis.change }}
    - Expected effect: {{ hypothesis.expected_effect }}
    - Risk: {{ hypothesis.risk }}
    {%- if hypothesis.target_instance_ids %}
    - Train tasks that fail this way: {{ hypothesis.target_instance_ids | join(", ") }}
    {%- endif %}

    Implement exactly this hypothesis, as small a change as does it. Do not add unrelated changes.

    ## Where you may write

    You may read the whole repository. You may write only these two directories:

    {% for path in pack_dirs %}- `{{ worktree }}/{{ path }}/`
    {% endfor %}
    Every other path is mounted read-only, so a write there fails with "Read-only file system". git does not work in the sandbox, and you need not commit: goaly commits your change after you finish. To see what you changed, compare files with `diff` against a copy you made in `/tmp`, or read them again.

    ## The pack

    The pack in `{{ pack_dirs[0] }}/` is what the executor model, Qwen, runs on each task:

    - `prompt.md`: the system prompt template.
    - `skills/*.md`: skill guides, ideally no more than 3, each focused; any can be removed.
    - `tools.py`: the benchmark's tools, built on core's Tool protocol (`goaly.harness.core.tools`).
    - `policy.py`: how a task is solved: phases, self-checks, when to add guidance, best-of-n, fallback submission.
    - `config.yaml`: sampling parameters, thinking on or off, budgets, context thresholds.

    Its unit tests live in `{{ pack_dirs[1] }}/`. Keep them passing, and add tests for code you add.

    ## Rules for pack code

    goaly checks your change before it is evaluated, and rejects the candidate if a check fails.

    Hard-coding is forbidden:
    - no task's answer or part of one: no gold SQL, no query result written out as constants;
    - no special cases for particular tasks or instance IDs, and no large literal lists;
    - the pack must never lead the executor to return precomputed or constant results instead of computing them, including constants behind a data check, such as `CASE WHEN (SELECT count(*) ...) > N THEN <constant>`, or a constant `UNION ALL` behind a one-time filter. The grader flags such predictions, a flagged prediction fails the candidate, and the project lead reviews every results PR;
    - general techniques only, which would help on tasks you have never seen.

    Python in `{{ pack_dirs[0] }}/` must pass a static allowlist:
    - imports only from: the standard library modules {{ allowed_stdlib | join(", ") }}; pydantic; `goaly.contracts`; the pack itself, including relative imports; and the core modules {% for module in allowed_core_modules %}`goaly.harness.core.{{ module }}`{{ ", " if not loop.last }}{% endfor %}. Reach a core module only as `from goaly.harness.core.<module> import <name>`, never `import goaly.harness.core.<module>`. Never core's settings or LLM client;
    - no `open`, `eval`, `exec`, `compile`, `__import__`, `type()`, `getattr()`, `setattr()`, `delattr()`, `vars()`, `globals()`, `locals()`, `dir()`, `input()` or `breakpoint()`;
    - no attribute whose name starts with `_`, on any object (`self.__x` inside your own class is the one exception), and no dunders but `__init__`, `__post_init__`, `__name__` and `__doc__`. A class body may define no dunder but `__init__` and `__post_init__`;
    - no `.format()` or `.format_map()`: use f-strings;
    - no string in an annotation: no quoted annotations, no `from __future__ import annotations`, and no `Literal["..."]`: use an Enum instead;
    - no string constant inside any subscript, dict keys included: write `data.get("key")` and `data.update({"key": value})`, never `data["key"]`; and no string field types in the functional `NamedTuple`, `TypedDict` or `make_dataclass` forms;
    - in pydantic, no `from_attributes`, no `alias` or `validation_alias` arguments, and no `AliasPath` or `AliasChoices`.

    ## Checking your change

    Run the pack's unit tests with `python -m pytest {{ pack_dirs[1] }} -q -p no:cacheprovider`.
    {%- if smoke %}

    To see your pack work on a real task, run `goaly-smoke <instance_id>` with the ID of a train task, such as one of the hypothesis's train tasks. goaly runs the checks above on your pack as it stands, then runs the executor on that one task and grades it, which takes a few minutes. It reports the score (Effi-SQL's credit, from 0 to 1), the stop reason, the step count, the cost and the last tool error. Train tasks only, and at most {{ smoke_limit }} runs per hypothesis, so use it once your change is ready. Run it on its own, not in a pipeline or with other commands. For the smoke run goaly stops your sandbox and then starts a fresh one: your files in the pack stay, but `/tmp` is emptied and anything you started in the background ends.
    {%- endif %}

    ## Finishing

    When the change is done and its tests pass, finish with a command whose output starts with the line `COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`, followed by a short summary of what you changed and how you checked it, for example:

    ```
    printf 'COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\nAdded a skill that ... Unit tests pass.\n'
    ```

    The first line of the summary becomes the commit's subject. Do not combine this command with any other; after it you cannot continue. If you decide the hypothesis cannot be implemented, finish the same way, without changes, and say why.
