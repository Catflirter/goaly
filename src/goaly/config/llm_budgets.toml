# The LLM concurrency budgets (spec §6.2), as goaly.harness.core.llm_budgets reads them.
#
# A model's budget is how many of its requests may be in flight across all of our processes.
# Each phase divides the budgets among the processes that run at the same time, and
# `goaly run --phase P --share S` runs with phase P's share for process S (by default, the
# benchmark's name). A process has exactly the shares listed for it: a model it has no share
# of is one it must not call, and nothing falls back to a model's whole budget.
#
# This file is outside harness/core/, so editing it leaves the harness hash and the evaluation
# cache as they are; each run's config hash records its share.

[budgets]
"qwen3.6-35b-a3b" = 48 # About 75% of the concurrency at which throughput stops growing.
"glm-5.3" = 16

# The baseline (T12): v0's dev runs on train and val, then its three held-out runs.
[phases.baseline]
effisql = { "qwen3.6-35b-a3b" = 40 }
background = { "qwen3.6-35b-a3b" = 8 }

# The RSI run (T22). The Effi-SQL lane's GLM share covers its analyst, its implementers and its
# lesson writer. Background covers confirmation reruns and any v0 held-out runs still pending.
# 8 of Qwen and 8 of GLM stay spare.
[phases.rsi]
effisql = { "qwen3.6-35b-a3b" = 32, "glm-5.3" = 8 }
background = { "qwen3.6-35b-a3b" = 8 }

# The final evaluation (T23) and the organizers' runs; GLM is no longer available. 8 of Qwen
# stay spare.
[phases.final]
effisql = { "qwen3.6-35b-a3b" = 40 }
