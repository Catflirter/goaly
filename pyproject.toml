[build-system]
requires = ["hatchling==1.32.4"] # Exact: uv.lock does not cover the build backend.
build-backend = "hatchling.build"

[project]
name = "goaly"
version = "0.1.0"
description = "Self-evolving harness: GLM-5.3 improves the agent harness Qwen uses on Effi-SQL and SWE-fficiency."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28", # Pre-1.0, so a minor release may break: 0.28 is the one the client is tested on
    "protobuf>=7.35.1", # The generated code rejects a runtime older than its gencode, 7.35.1
    "pydantic>=2.4", # 2.4 added ValidationError.errors(include_input=...)
    "pydantic-settings>=2",
]

[project.scripts]
goaly = "goaly.cli:main"

[dependency-groups]
dev = [
    "anyio>=4", # Its pytest plugin runs the async tests (tests/conftest.py)
    "grpcio-tools>=1.84", # Bundles protoc 35.1; after changing its version, run `make proto`
    "import-linter>=2.14", # 2.14 added --no-logo
    "mypy>=2",
    "mypy-protobuf>=5",
    "pre-commit>=4",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.17", # ruff is pre-1.0: its minor releases are its breaking releases
    "sqlparse==0.5.2", # The official Effi-SQL runner's pin; the extractor parity tests use it
    "types-protobuf>=7",
]
# RSI only (spec §8.8, §11): `make setup` and CI install it, a plain `uv sync` leaves it out.
rsi = [
    "mini-swe-agent==2.4.6", # Exact: the implementer relies on its message format and helpers
]

[tool.uv]
# Cooldown: lock nothing released in the 3 days before locking; move the date deliberately.
exclude-newer = "2026-10-11T00:00:00Z"
# mini-swe-agent requires these, but the classes goaly.rsi uses never import them (spec §11).
# Leaving out litellm also keeps it out of the process that holds the API key.
exclude-dependencies = [
    { package = { name = "mini-swe-agent" }, dependencies = [
        "litellm", "openai", "datasets", "textual", "prompt-toolkit",
    ] },
]

[tool.hatch.build.targets.wheel]
packages = ["src/goaly"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Code blocks in the docs are illustrative; keep ruff from reformatting Markdown.
# protoc and mypy-protobuf write src/goaly/contracts/gen/; make proto-check keeps it as written.
extend-exclude = ["*.md", "src/goaly/contracts/gen/"]

[tool.ruff.lint]
select = [
    # Required by the engineering standards.
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S", "N",
    # Extra low-noise checks.
    "BLE", "DTZ", "G", "LOG", "PGH", "PIE", "PTH", "RET", "T20",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The LLM errors are named for the failure, as the spec names them: ContextOverflow, RateLimited...
"src/goaly/harness/core/llm_errors.py" = ["N818"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
# Name modules goaly.* and tests.*, so test files in mirrored directories can share basenames.
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
# Every `type: ignore` needs an error code, plus a comment giving the reason.
enable_error_code = ["ignore-without-code"]
warn_unreachable = true

[[tool.mypy.overrides]]
# sqlparse 0.5.2, the official runner's pin, ships no type information; only the tests use it.
module = ["sqlparse", "sqlparse.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# The one module that calls into mini-swe-agent, which leaves many functions unannotated (spec §11).
module = ["goaly.rsi.implementer.msa"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests import shared test code as tests.<module>, e.g. tests.fakes.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra"]
markers = [
    "integration: needs Docker, a database or the real model API; skipped unless --integration is given",
]
filterwarnings = ["error"]
xfail_strict = true

# Coverage is switched on by `make test` (pytest --cov), not by addopts.
[tool.coverage.run]
branch = true
source_pkgs = ["goaly"]
omit = ["src/goaly/contracts/gen/*"] # Generated by protoc.

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_package = "goaly"
# Lets the contracts name third-party packages, such as minisweagent.
include_external_packages = true

# goaly.cli is the composition root (spec §3.1): the one module that may import every layer.
[[tool.importlinter.contracts]]
name = "Layers: cli > rsi > bench > harness > contracts"
type = "layers"
layers = ["goaly.cli", "goaly.rsi", "goaly.bench", "goaly.harness", "goaly.contracts"]

[[tool.importlinter.contracts]]
name = "Only goaly.rsi may import mini-swe-agent"
type = "forbidden"
source_modules = ["goaly.contracts", "goaly.harness", "goaly.bench"]
forbidden_modules = ["minisweagent"]
