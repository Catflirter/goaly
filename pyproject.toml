[build-system]
requires = ["hatchling==1.32.4"] # Exact: uv.lock does not cover the build backend.
build-backend = "hatchling.build"

[project]
name = "goaly"
version = "0.1.0"
description = "Self-evolving harness: GLM-5.3 improves the agent harness Qwen uses on SWE-fficiency and BIRD-CRITIC."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2.2", # 2.2 added env_ignore_empty
]

[dependency-groups]
dev = [
    "import-linter>=2.14", # 2.14 added --no-logo
    "mypy>=2",
    "pre-commit>=4",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.17", # ruff is pre-1.0: its minor releases are its breaking releases
]

[tool.uv]
# Cooldown: lock nothing released in the 3 days before locking; move the date deliberately.
exclude-newer = "2026-10-11T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/goaly"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Code blocks in the docs are illustrative; keep ruff from reformatting Markdown.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    # Required by the engineering standards.
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S", "N",
    # Extra low-noise checks.
    "BLE", "DTZ", "G", "LOG", "PGH", "PIE", "PTH", "RET", "T20",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Name modules goaly.* and tests.*, so test files in mirrored directories can share basenames.
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
# Every `type: ignore` needs an error code, plus a comment giving the reason.
enable_error_code = ["ignore-without-code"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra"]
markers = [
    "integration: needs Docker, a database or the real model API; skipped unless --integration is given",
]
filterwarnings = ["error"]
xfail_strict = true

# Coverage is switched on by `make test` (pytest --cov), not by addopts.
[tool.coverage.run]
branch = true
source_pkgs = ["goaly"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_package = "goaly"

# T02a adds goaly.contracts below goaly.harness; T06 adds goaly.cli above goaly.rsi.
[[tool.importlinter.contracts]]
name = "Layers: rsi > bench > harness"
type = "layers"
layers = ["goaly.rsi", "goaly.bench", "goaly.harness"]
