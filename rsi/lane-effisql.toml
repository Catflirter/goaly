# The Effi-SQL lane (goaly rsi lane --lane effisql --config rsi/lane-effisql.toml).
# Keys: goaly.rsi.cli.LaneSettings; [lane]: goaly.rsi.lane.LaneConfig.

name = "effisql"
repo = "."
v0 = "v0"  # T12's tag: the integration commit v0's baseline ran at.
# T11's evaluator factory, "module:function", which drives `goaly run --phase all` (V27).
evaluator = "goaly.bench.effisql.evaluate:make_evaluator"
# T22's hooks: results PRs, ntfy.sh notifications and the heartbeat the supervisor watches.
hooks = "goaly.rsi.hooks:lane_hooks"

[lane]
# The freeze (spec §13), absolute, so a restart never moves it.
deadline = "2026-10-15T20:00:00Z"
max_rounds_without_accept = 4
infrastructure_backoff_s = 120
task_concurrency = 16
implementer_threads = 3

[lane.round]
k = 3
screen_failures = 15
screen_solved = 5
screen_seed = 0
validation_seed = 0
confirmation_seed = 1

[lane.round.decision]
min_delta = 0.05
sign_test_max_p = 0.1
max_regressions = 1
confirm_min_delta = 0.03
cost_guardrail_ratio = 1.5
efficiency_cap_ratio = 3.0
