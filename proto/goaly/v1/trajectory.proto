// The trajectory contracts (spec §3.3, §5.1): every step the agent took on a task, with the
// messages, tool calls and results, usage and timing of each.
syntax = "proto3";

package goaly.v1;

import "goaly/v1/llm_call.proto";
import "goaly/v1/task.proto";
import "google/protobuf/timestamp.proto";

// Everything the agent did on one task, one seed, in one run (spec §5.1): one line of the run's
// trajectories file. If several lines share run_id, instance_id and seed, the last one wins.
message Trajectory {
  // The run it belongs to.
  string run_id = 1;
  // The task.
  string instance_id = 2;
  // The 0-based replicate index (spec §6.1), which names the same replicate in every run. A
  // confirmation run takes a new index, so the evaluation cache never hands it a validation
  // seed's result.
  int32 seed = 3;
  // What the agent was given.
  TaskInput task = 4;
  // The policy's conversations with the model, in the order they started. A policy with one
  // conversation has exactly chats[0]; best-of-n, phases or a verifier have more (spec §5.2).
  repeated Chat chats = 5;
  // Every model call, of every chat, in the order the calls were made.
  repeated Step steps = 6;
  // What the policy returned; absent if it returned nothing, as when it crashed.
  Prediction prediction = 7;
  // How the prediction was graded, as in the task's TaskResult. Only the one-process mode fills
  // it. A two-phase run's trajectory carries no grade: readers take grades from the results
  // file, results.jsonl (spec §5.1, §6.1). Also absent in a run that is not graded.
  Grade grade = 8;
  // Why the agent stopped.
  StopReason stop_reason = 9;
  // What went wrong, if the agent stopped on an error; empty otherwise.
  string error_message = 10;
  // The tokens and cost of every model call made for the task.
  Usage usage = 11;
  // When the agent started on the task.
  google.protobuf.Timestamp started_at = 12;
  // When it stopped.
  google.protobuf.Timestamp finished_at = 13;
}

// Why the agent stopped working on a task. TaskErrorType says which reason each error comes with.
enum StopReason {
  // Not set.
  STOP_REASON_UNSPECIFIED = 0;
  // A tool returned a submission (ToolResult.submission), which ended the episode.
  STOP_REASON_SUBMITTED = 1;
  // The step budget ran out (spec §5.1), so the policy's fallback answered (spec §5.4).
  STOP_REASON_STEP_BUDGET_EXHAUSTED = 2;
  // The wall-clock budget ran out, so the policy's fallback answered.
  STOP_REASON_TIME_BUDGET_EXHAUSTED = 3;
  // The token budget ran out, so the policy's fallback answered.
  STOP_REASON_TOKEN_BUDGET_EXHAUSTED = 4;
  // The cost budget ran out, so the policy's fallback answered.
  STOP_REASON_COST_BUDGET_EXHAUSTED = 5;
  // The model made too many errors in a row (spec §5.1).
  STOP_REASON_CONSECUTIVE_ERRORS = 6;
  // An exception ended the task; error_message says what it was.
  STOP_REASON_CRASHED = 7;
  // The runner cancelled the task, for example at its time limit.
  STOP_REASON_CANCELLED = 8;
}

// One linear conversation with the model: each of its steps is sent everything before it in the
// chat. Calls that are not sent each other's messages, such as best-of-n samples, belong to
// separate chats.
message Chat {
  // A name the policy gives the chat, such as "main", "sample-2" or "verify".
  string label = 1;
  // The step whose full context the chat continues, as an index into Trajectory.steps; absent
  // if the chat starts afresh. That context is the step's prompt, then its assistant message,
  // tool results and injected messages, and it comes before initial_messages.
  optional int32 forked_from_step = 2;
  // The messages the chat starts with, after any forked context: for the first chat, the system
  // prompt and the task. May be empty in a forked chat.
  repeated ChatMessage initial_messages = 3;
  // The replay window, from the run's context configuration (spec §5.1; the rule is in Step's
  // comment). More than 0 on every executor chat: how many of the latest steps in a prompt keep
  // their assistant message's reasoning_content, 8 for baseline v0. Unset or 0: not an executor
  // chat, so its messages are replayed unchanged, as GLM's are.
  optional int32 keep_turns = 4;
}

// One model call and the tool calls it made (spec §5.1). A step holds only what it adds to its
// chat, never the history before it, and the trajectory stores every message in full. The prompt
// its call was sent is, in order:
//   1. the forked context of its chat, if any;
//   2. the chat's initial_messages;
//   3. each earlier step of the same chat: its assistant message, its tool results as tool
//      messages, and its injected messages.
// Then every fold in effect at the step replaces the content of the tool message it names. In an
// executor chat, one whose keep_turns is more than 0, two replay rules also apply to the whole
// prompt, forked context included (spec §5.1):
//   - XML markup: every replayed assistant message loses all Qwen3-Coder tool-call markup from
//     its content and its reasoning_content: each <tool_call> block, then each bare
//     <function=...> block. A block ends at its closing tag, at the next block of its kind or at
//     the end of the text. This holds whether or not a call was parsed from the markup, and
//     whatever the source of the message's tool_calls, which it keeps.
//   - Reasoning: an assistant message keeps its reasoning_content only while its step is among
//     the last keep_turns steps whose assistant messages the prompt holds, counted back from the
//     newest and through the forked context. Older assistant messages keep their content and are
//     sent without reasoning.
// Any other chat, as GLM's, replays its messages unchanged.
message Step {
  // The step's position in Trajectory.steps, from 0.
  int32 index = 1;
  // The chat it belongs to, as an index into Trajectory.chats.
  int32 chat = 2;
  // The call_id of the LlmCallRecord of this step's model call.
  string call_id = 3;
  // When the model call began, before any wait for a concurrency slot, as in its LlmCallRecord.
  google.protobuf.Timestamp started_at = 4;
  // How long the whole model call took, in seconds, including any wait for a concurrency slot
  // or a backoff: the same as its LlmCallRecord.latency_s.
  double latency_s = 5;
  // The tokens and cost of the model call.
  Usage usage = 6;
  // The harness's own count of the prompt's tokens before the call: the number the folding
  // threshold compares (spec §5.1). usage.input_tokens is the gateway's count.
  int64 estimated_prompt_tokens = 7;
  // The tool outputs folded into summaries just before this call (spec §5.1). A fold stays in
  // effect for the rest of the chat, and in any chat forked from this step or a later one.
  repeated ContextFold folds = 8;
  // The message the model returned.
  ChatMessage assistant = 9;
  // The results of the assistant's tool calls, in the order of its tool_calls.
  repeated ToolResult tool_results = 10;
  // Guidance the policy added after the tool results, such as a hint or a reminder of the tool
  // schemas (spec §5.1, §5.3).
  repeated ChatMessage injected = 11;
}

// A tool output that the context manager replaced with a summary (spec §5.1). A model call that
// writes such a summary is an ordinary step, in a chat the harness labels, e.g.
// "fold-summarizer".
message ContextFold {
  // The step whose tool result was folded, as an index into Trajectory.steps.
  int32 step = 1;
  // The tool_call_id of that tool result.
  string tool_call_id = 2;
  // The text the model was sent instead of the tool result's content.
  string replacement = 3;
}

// One message of a chat with the model, modeled on the OpenAI chat format.
message ChatMessage {
  // Who the message is from.
  ChatRole role = 1;
  // The message's text; may be empty, as when an assistant message only calls tools.
  string content = 2;
  // The model's thinking, on an assistant message; empty otherwise.
  string reasoning_content = 3;
  // The tools an assistant message calls, in order.
  repeated ToolCall tool_calls = 4;
  // On a tool message, the ID of the tool call it answers; empty otherwise.
  string tool_call_id = 5;
}

// Who a chat message is from.
enum ChatRole {
  // Not set.
  CHAT_ROLE_UNSPECIFIED = 0;
  // The system prompt.
  CHAT_ROLE_SYSTEM = 1;
  // The user: the task, and guidance the policy adds during the run.
  CHAT_ROLE_USER = 2;
  // The model.
  CHAT_ROLE_ASSISTANT = 3;
  // A tool's result.
  CHAT_ROLE_TOOL = 4;
}

// A tool call the model made.
message ToolCall {
  // The call's ID, which the tool message answering it repeats. The parser makes one up for a
  // call parsed from XML.
  string id = 1;
  // The name of the tool called.
  string name = 2;
  // The arguments, a JSON object as text, exactly as the model wrote it: possibly malformed or
  // truncated (spec §5.1). For a call parsed from XML, the parser writes it from the parameters.
  string arguments_json = 3;
  // The arguments the tool actually ran with, after core repaired malformed JSON (spec §5.1);
  // empty when no repair happened.
  string repaired_arguments_json = 4;
  // Where the call was parsed from.
  ToolCallSource source = 5;
}

// Where a tool call was parsed from (spec §5.1).
enum ToolCallSource {
  // Not set.
  TOOL_CALL_SOURCE_UNSPECIFIED = 0;
  // The response's standard tool_calls field.
  TOOL_CALL_SOURCE_STANDARD = 1;
  // Qwen3-Coder XML (<tool_call><function=...>) in the reasoning_content.
  TOOL_CALL_SOURCE_REASONING_XML = 2;
  // Qwen3-Coder XML in the content.
  TOOL_CALL_SOURCE_CONTENT_XML = 3;
}

// The result of one tool call. The model sees it as a tool message: tool_call_id and content.
// The tool fills content and submission; core's executor fills the rest, including is_error.
message ToolResult {
  // The ID of the tool call this answers.
  string tool_call_id = 1;
  // The name of the tool called.
  string name = 2;
  // The text shown to the model, after any truncation.
  string content = 3;
  // True if the call itself failed: its arguments were invalid, it timed out, or the tool
  // raised. A statement or command that ran and failed, such as SQL that raised an error or a
  // command that exited non-zero, is a normal result. So the consecutive-error rule (spec
  // §5.1) counts only calls that failed.
  bool is_error = 4;
  // True if the executor cut long output down to its start and end (spec §5.1).
  bool truncated = 5;
  // How long the tool ran, in seconds.
  double elapsed_s = 6;
  // What the tool submits, if it submits. A tool ends the episode by returning a result with
  // this set: the agent loop stops, and the policy decides whether to return it. So a pack
  // can submit through any tool, one that verifies before it submits included.
  optional Prediction submission = 7;
}
