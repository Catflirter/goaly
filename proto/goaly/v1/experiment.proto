// The RSI ledger contracts (spec §3.3, §8.2, §8.3, §8.6-§8.8): the experiments with their
// implementer runs, the lessons learned from them, and the lanes' events.
syntax = "proto3";

package goaly.v1;

import "goaly/v1/llm_call.proto";
import "goaly/v1/task.proto";
import "google/protobuf/timestamp.proto";

// An RSI lane (spec §8.1): one benchmark's improvement loop, which edits only that benchmark's
// pack. LANE_EFFISQL is the benchmark whose adapter is named "effisql", and LANE_SWE the one
// named "swefficiency". The SWE lane is on hold (2026-10-15).
enum Lane {
  // Not set.
  LANE_UNSPECIFIED = 0;
  // The Effi-SQL lane.
  LANE_EFFISQL = 1;
  // The SWE-fficiency lane, on hold since 2026-10-15.
  LANE_SWE = 2;
}

// A change the analyst proposes to a lane's pack (spec §8.2). Its lane is that of the
// experiment that tries it, and hypothesis queues are kept per lane.
message Hypothesis {
  // A unique ID. A hypothesis rebuilt in a later round keeps it.
  string hypothesis_id = 1;
  // The failure pattern it targets, as the analyst grouped the failures.
  string failure_pattern = 2;
  // The train tasks that fail in that pattern, which the screen draws on (spec §8.2).
  repeated string target_instance_ids = 3;
  // The kind of change.
  ChangeKind change_kind = 4;
  // Exactly what to change.
  string change = 5;
  // The effect the analyst expects.
  string expected_effect = 6;
  // What could go wrong.
  string risk = 7;
  // Where the idea came from.
  HypothesisSource source = 8;
}

// The kind of change a hypothesis makes to a pack (spec §5.2, §8.2).
enum ChangeKind {
  // Not set.
  CHANGE_KIND_UNSPECIFIED = 0;
  // The system prompt, prompt.md.
  CHANGE_KIND_PROMPT = 1;
  // A skill guide in skills/.
  CHANGE_KIND_SKILL = 2;
  // A tool, in tools.py.
  CHANGE_KIND_TOOL = 3;
  // How the policy solves a task, in policy.py.
  CHANGE_KIND_POLICY = 4;
  // A setting in config.yaml, such as sampling, a budget or a context threshold.
  CHANGE_KIND_CONFIG = 5;
  // Removing a tool, skill or rule that does not help (spec §5.3).
  CHANGE_KIND_REMOVAL = 6;
}

// Where a hypothesis's idea came from (spec §8.2, §8.6).
enum HypothesisSource {
  // Not set.
  HYPOTHESIS_SOURCE_UNSPECIFIED = 0;
  // The idea bank of techniques that prior work found effective.
  HYPOTHESIS_SOURCE_IDEA_BANK = 1;
  // The analyst's own analysis of the failures.
  HYPOTHESIS_SOURCE_ANALYST = 2;
}

// One candidate's experiment, from hypothesis to decision (spec §8.2, §8.6): one line of
// experiments.jsonl. A lane writes the record as the experiment goes (spec §8.7), and the last
// line for an experiment_id wins. Until the decision, decision is DECISION_PENDING and the
// fields of the steps that have not run stay unset.
message ExperimentRecord {
  // A unique ID, which lessons cite in Lesson.experiment_ids.
  string experiment_id = 1;
  // The lane.
  Lane lane = 2;
  // The lane's round the experiment ran in, counting from 1.
  int32 round = 3;
  // The best version the candidate was built on (spec §8.1): its commit, or a fixed tag such as
  // baseline-v0.
  string parent_version = 4;
  // The commit that implements the hypothesis; empty if the implementer made none.
  string candidate_commit = 5;
  // What the candidate tries.
  Hypothesis hypothesis = 6;
  // How the implementer agent built the candidate (spec §8.8); absent until the agent's run
  // ends, and absent if it never started.
  ImplementerRun implementer = 19;
  // The size of the candidate's diff against parent_version.
  DiffStats diff_stats = 7;
  // The guards' outcomes, in the order they ran.
  repeated GuardResult guards = 8;
  // The screen's results; absent if it did not run.
  PhaseResult screening = 9;
  // The validation's results; absent if it did not run.
  PhaseResult validation = 10;
  // Effi-SQL only: the confirmation's results, over the validation seeds plus the
  // confirmation seed; absent if it did not run.
  PhaseResult confirmation = 11;
  // What became of the candidate.
  Decision decision = 12;
  // Every rule the candidate failed, in the order the decision code checked them; empty unless
  // decision is DECISION_REJECTED.
  repeated RejectionReason rejection_reasons = 13;
  // The reasoning behind the decision, in words.
  string decision_reason = 14;
  // The thresholds the decision used.
  DecisionThresholds thresholds = 15;
  // The experiment's tokens and cost, one entry per call purpose (spec §9). The round's single
  // CALL_PURPOSE_RSI_ANALYST usage is split evenly across the experiments it proposed, any
  // token remainder going to the first, so summing over experiments gives the exact total.
  repeated PurposeUsage usage_by_purpose = 16;
  // When the experiment started.
  google.protobuf.Timestamp started_at = 17;
  // When it was decided or aborted; absent until then.
  google.protobuf.Timestamp finished_at = 18;
}

// How the implementer agent built a candidate (spec §8.2 step 2, §8.6, §8.8): one run of
// mini-swe-agent's DefaultAgent in a Docker sandbox. Its model calls are recorded as
// LlmCallRecords with purpose CALL_PURPOSE_RSI_IMPL and the experiment ID as run_id, and their
// tokens and cost are in the experiment's usage_by_purpose.
message ImplementerRun {
  // How the run ended.
  ImplementerExit exit = 1;
  // How many steps the agent took, one model call each.
  int32 steps = 2;
  // From the agent's start to its end, in seconds.
  double wall_time_s = 3;
  // Where the agent's trajectory is, relative to the runs directory:
  // rsi/<lane>/<experiment_id>/implementer.traj.json. The file stays in mini-swe-agent's own
  // format, which it names in its trajectory_format key; it is not converted to a Trajectory.
  // Empty if the agent saved none.
  string trajectory_path = 4;
  // The agent's goaly-smoke calls, in order.
  repeated SmokeTest smoke_tests = 5;
  // The agent's closing summary, which it submitted with COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT:
  // what it changed and what it checked. Empty unless the agent finished.
  string summary = 6;
}

// How an implementer run ended (spec §8.2 step 2, §8.8). Only IMPLEMENTER_EXIT_SUBMITTED leads to
// a commit. Every other ending makes none, and the candidate is rejected as not implemented
// (REJECTION_REASON_IMPLEMENTATION_FAILED), except after IMPLEMENTER_EXIT_INFRASTRUCTURE or
// IMPLEMENTER_EXIT_INTERRUPTED: neither says anything about the hypothesis, so the experiment is
// aborted instead. A model call that fails ends the run as follows. IMPLEMENTER_EXIT_INFRASTRUCTURE
// is a gateway outage that outlasted its retries (LLM_CALL_STATUS_RATE_LIMITED, SERVER_ERROR,
// TIMEOUT or CONNECTION_ERROR) or an open breaker. IMPLEMENTER_EXIT_CRASHED is
// LLM_CALL_STATUS_CONTEXT_OVERFLOW, INVALID_RESPONSE or CLIENT_ERROR.
enum ImplementerExit {
  // Not set.
  IMPLEMENTER_EXIT_UNSPECIFIED = 0;
  // The agent finished and changed its pack; goaly.rsi then commits the change on the host.
  IMPLEMENTER_EXIT_SUBMITTED = 1;
  // The agent finished without changing anything.
  IMPLEMENTER_EXIT_NO_CHANGES = 2;
  // The agent reached its step limit.
  IMPLEMENTER_EXIT_STEP_LIMIT = 3;
  // The agent reached its cost limit, which counts each call's cost as the gateway reports it.
  IMPLEMENTER_EXIT_COST_LIMIT = 4;
  // The agent reached its wall-time limit.
  IMPLEMENTER_EXIT_TIME_LIMIT = 5;
  // The agent stopped after too many model responses in a row that it could not parse.
  IMPLEMENTER_EXIT_FORMAT_ERRORS = 6;
  // The gateway or Docker failed.
  IMPLEMENTER_EXIT_INFRASTRUCTURE = 7;
  // The run was cut short: goaly.rsi stopped it, as when the lane's time budget ran out, or the
  // lane crashed, and the restarted lane found the run unfinished (spec §8.7). It has a value of
  // its own because such an experiment is aborted, while a crash of the run itself rejects the
  // candidate.
  IMPLEMENTER_EXIT_INTERRUPTED = 8;
  // Any other error ended the run.
  IMPLEMENTER_EXIT_CRASHED = 9;
}

// One goaly-smoke call by the implementer agent (spec §8.8). The host refuses any task that is
// not in train, and any call after the second; otherwise it runs the step-3 guards on the
// worktree as it stands, then the candidate on the task with the bench runner and one seed. The
// smoke run's model calls count toward the experiment's usage_by_purpose (spec §9).
message SmokeTest {
  // The task the agent asked for.
  string instance_id = 1;
  // The smoke run that holds the task's result and trajectory; empty if the candidate never ran.
  string run_id = 2;
  // The task's score, as its benchmark defines it: for Effi-SQL, the credit. Unset if the
  // candidate never ran, because the host refused the call or a guard failed, and also if it ran
  // but grading failed. It is optional so that such a call stays distinct from a run that scored
  // 0.
  optional double score = 3;
  // What goaly-smoke told the agent besides the score: the stop reason, the step count, the cost
  // and the last tool error; or why the host refused the call, or which guard failed.
  string detail = 4;
}

// The size of a diff, as git diff --shortstat counts it.
message DiffStats {
  // How many files it changes.
  int32 files_changed = 1;
  // How many lines it adds.
  int32 insertions = 2;
  // How many lines it removes.
  int32 deletions = 3;
}

// The outcome of one guard.
message GuardResult {
  // The guard.
  Guard guard = 1;
  // True if the candidate passed it.
  bool passed = 2;
  // What the guard found, such as why it failed or a warning; may be empty.
  string detail = 3;
}

// A check that a candidate must pass before it is evaluated (spec §8.2, §8.5). The values are
// declared by number. The guards run in the order of spec §8.2 step 3: ALLOWED_PATHS, CHECKSUMS,
// HARD_CODING_SCAN, PACK_CODE_ALLOWLIST, then UNIT_TESTS.
enum Guard {
  // Not set.
  GUARD_UNSPECIFIED = 0;
  // The diff stays inside the lane's allowed paths.
  GUARD_ALLOWED_PATHS = 1;
  // The bench/, harness/core/ and contracts/ checksums are unchanged.
  GUARD_CHECKSUMS = 2;
  // The hard-coding scan finds nothing task-specific in the diff (spec §8.5). For Effi-SQL it
  // scans only gold-only windows: windows of any split's gold optimized_sql, 40 or more
  // characters long after normalization, that occur in no base_sql and not in the schema DDL.
  // It also rejects pack changes that embed large literal lists, above a size set in config.
  // For SWE (on hold) it applies the same gold-only-fragment rule to the gold patches, with
  // windows 40 or more characters long after normalization, and also rejects any instance_id
  // from any split.
  GUARD_HARD_CODING_SCAN = 3;
  // The pack's unit tests pass.
  GUARD_UNIT_TESTS = 4;
  // The static AST allowlist passes on the candidate's pack code, which runs on the host during
  // smoke tests, screening and validation (spec §8.5). It is a static defense in depth, not a
  // sandbox. Imports may come only from: an explicit list of goaly.harness.core modules, which
  // leaves out settings and every llm* module; goaly.contracts; pydantic; relative imports and
  // goaly.harness.packs.<lane>, the lane's own pack; a closed list of pure stdlib modules, such
  // as json, re and typing; and asyncio, for concurrency only. Banned: the builtins open, eval,
  // exec, compile, __import__, getattr, setattr, delattr, vars, globals, locals, dir, type,
  // breakpoint, input and memoryview; any attribute name that starts with _, except on self or
  // cls; calls to .format and .format_map; the frame and coroutine attributes f_*, gi_*, cr_*,
  // ag_* and tb_*; any attribute of an imported module that is itself a module; and the attribute
  // names sys, os, modules, builtins and subprocess, and asyncio's process, socket and pipe
  // functions.
  GUARD_PACK_CODE_ALLOWLIST = 5;
}

// How a candidate did against the best in one phase: screen, validate or confirm (spec §8.2,
// §8.3). Scores and deltas are fractions, not percentages: 5 R-VES points is 0.05. A task's
// tokens are its input plus output tokens, output including reasoning. A statistic the phase
// did not compute is absent.
message PhaseResult {
  // The split the phase ran on.
  Split split = 1;
  // How many tasks it compared.
  int32 task_count = 2;
  // How many seeds it compared per task.
  int32 seed_count = 3;
  // The candidate's score: Effi-SQL's mean credit (R-VES / 100); SWE's harmonic-mean SR.
  double candidate_score = 4;
  // The best's score on the same tasks and seeds.
  double best_score = 5;
  // candidate_score - best_score.
  double delta = 6;
  // The smallest delta the phase accepted, doubled if the cost guardrail tripped. For the
  // validation: Effi-SQL's min_delta, or SWE's min_relative_gain times best_score. For the
  // confirmation: confirm_min_delta. Absent for the screen, which needs only a delta above 0.
  optional double effective_min_delta = 7;
  // How many tasks the candidate beat the best on, by each task's score averaged over seeds.
  optional int32 wins = 8;
  // How many tasks the best beat the candidate on.
  optional int32 losses = 9;
  // The one-sided sign test's p-value for wins against losses.
  optional double sign_test_p = 10;
  // P(Δ>0), the probability of a gain, by paired bootstrap.
  optional double gain_probability = 11;
  // How many tasks regressed, as spec §8.3 defines a regression for the lane.
  optional int32 regressions = 12;
  // The tasks on which the candidate made a matched prediction that a check flagged, in any
  // seed, each listed once (spec §4.1). The checks are those against hard-coded results, and the
  // flags are hard_coded, which is EffiSqlGrade.alt_matched false, and literal_result. An
  // unmatched prediction is never checked, so it is never listed. Each task's grade, in the runs
  // candidate_run_ids names, says which check flagged it. One flagged task fails the candidate
  // outright, as REJECTION_REASON_HARD_CODED. On the validation and the confirmation these are
  // per-task val IDs, so the analyst's ledger summary strips them (spec §7).
  repeated string flagged_instance_ids = 20;
  // The candidate's mean tokens per task over the best's, which the cost guardrail checks.
  optional double token_ratio_vs_best = 13;
  // Its mean wall time per task over the best's, which the cost guardrail checks.
  optional double time_ratio_vs_best = 14;
  // Its mean cost per task over v0's on the same split, which the efficiency cap checks.
  optional double cost_ratio_vs_v0 = 15;
  // Its mean wall time per task over v0's on the same split, which the efficiency cap checks.
  optional double time_ratio_vs_v0 = 16;
  // The candidate's runs whose results the phase compared.
  repeated string candidate_run_ids = 17;
  // The best's runs whose results the phase compared.
  repeated string best_run_ids = 18;
  // The v0 runs whose cost and wall time the ratios against v0 used.
  repeated string v0_run_ids = 19;
}

// What became of a candidate (spec §8.2).
enum Decision {
  // Not set.
  DECISION_UNSPECIFIED = 0;
  // Not decided yet. A lane writes this before the decision, so that after a crash it knows
  // where it stopped (spec §8.7).
  DECISION_PENDING = 1;
  // It became the lane's new best.
  DECISION_ACCEPTED = 2;
  // It was rejected; rejection_reasons says why.
  DECISION_REJECTED = 3;
  // It could not be evaluated, as when the lane's time budget ran out or the infrastructure
  // failed. That says nothing about the hypothesis, so no lesson may blame it.
  DECISION_ABORTED = 4;
}

// A rule that rejects a candidate: one value for each way spec §8.2 and §8.3 reject one. The
// values are declared by number. The decision code checks them in the order of the round's
// steps: IMPLEMENTATION_FAILED, GUARD_FAILED, HARD_CODED, NO_SCREEN_GAIN, EFFICIENCY_CAP,
// INSUFFICIENT_GAIN, COST_GUARDRAIL, NOT_SIGNIFICANT, REGRESSION, OUTRANKED, then NOT_CONFIRMED.
enum RejectionReason {
  // Not set; never written.
  REJECTION_REASON_UNSPECIFIED = 0;
  // The implementer made no commit for the hypothesis.
  REJECTION_REASON_IMPLEMENTATION_FAILED = 1;
  // A guard failed; guards says which.
  REJECTION_REASON_GUARD_FAILED = 2;
  // The screen showed no net gain over the best.
  REJECTION_REASON_NO_SCREEN_GAIN = 3;
  // Its mean cost or wall time per task exceeded the efficiency cap.
  REJECTION_REASON_EFFICIENCY_CAP = 4;
  // Its gain on validation fell short of the threshold.
  REJECTION_REASON_INSUFFICIENT_GAIN = 5;
  // Its gain reached the threshold, but not the doubled one that the cost guardrail set.
  REJECTION_REASON_COST_GUARDRAIL = 6;
  // Its gain was not significant: Effi-SQL's sign test or SWE's bootstrap failed.
  REJECTION_REASON_NOT_SIGNIFICANT = 7;
  // It caused more regressions than allowed.
  REJECTION_REASON_REGRESSION = 8;
  // It passed, but another candidate in the round gained more; its hypothesis goes back in the
  // queue.
  REJECTION_REASON_OUTRANKED = 9;
  // Effi-SQL: its gain over the validation seeds plus the confirmation seed fell below the
  // confirmation threshold.
  REJECTION_REASON_NOT_CONFIRMED = 10;
  // It made a matched prediction that a check flagged, in the screen, the validation or the
  // confirmation (spec §4.1, §8.2 step 4). The checks are those against hard-coded results, and
  // this covers both flags: hard_coded, which is EffiSqlGrade.alt_matched false, and
  // literal_result. That phase's flagged_instance_ids lists the flagged tasks.
  REJECTION_REASON_HARD_CODED = 11;
}

// The decision thresholds, as config set them (spec §8.3: every decision records the thresholds
// it used). Gains are fractions, and a task's tokens are counted, as in PhaseResult.
message DecisionThresholds {
  // The cost guardrail: above this multiple of the best's mean tokens or wall time per task,
  // every gain threshold doubles. For Effi-SQL, min_delta 0.05 becomes 0.10 and
  // confirm_min_delta 0.03 becomes 0.06; for SWE, min_relative_gain doubles.
  double cost_guardrail_ratio = 1;
  // The efficiency cap: above this multiple of v0's mean cost or wall time per task, a candidate
  // is rejected whatever its gain.
  double efficiency_cap_ratio = 2;

  // The lane's own gain, significance and regression thresholds.
  oneof benchmark {
    // The Effi-SQL lane's.
    EffiSqlThresholds effisql = 3;
    // The SWE-fficiency lane's.
    SweThresholds swe = 4;
  }
}

// The Effi-SQL lane's thresholds (spec §8.3). The defaults named here are config's.
message EffiSqlThresholds {
  // The smallest gain in R-VES accepted, as a fraction: by default 0.05, i.e. 5 points.
  double min_delta = 1;
  // The largest p-value accepted from the one-sided sign test on per-task credit: by default
  // 0.1.
  double sign_test_max_p = 2;
  // The most regressions accepted, by default 1. A task regresses if its credit is at least
  // 0.75 under the best and at most 0.25 under the candidate.
  int32 max_regressions = 3;
  // The smallest gain in R-VES over both seeds, the validation seed plus the confirmation
  // seed, that the confirmation accepts: by default 0.03.
  double confirm_min_delta = 4;
}

// The SWE-fficiency lane's thresholds (spec §8.3). The lane is on hold (2026-10-15).
message SweThresholds {
  // The smallest gain in harmonic-mean SR accepted, relative to the best's: 0.1 is 10%.
  double min_relative_gain = 1;
  // The smallest bootstrap P(Δ>0) accepted.
  double min_gain_probability = 2;
  // The most regressions accepted. A task regresses if it has a real speedup under the best,
  // SR above 1/gold speedup, and drops to SR at most 1/gold speedup under the candidate.
  int32 max_regressions = 3;
}

// The tokens and cost of the calls made for one purpose (spec §9).
message PurposeUsage {
  // The calls' purpose.
  CallPurpose purpose = 1;
  // Their tokens and cost, summed.
  Usage usage = 2;
}

// A lesson the RSI system learned (spec §8.6): one entry of lessons.jsonl, from which lessons.md
// is generated. The store appends a lesson's full state on every change, and the last line for a
// lesson_id wins.
message Lesson {
  // A unique ID.
  string lesson_id = 1;
  // The lane whose experiments taught it.
  Lane lane = 2;
  // What was tried, what happened and why.
  string text = 3;
  // The experiments the lesson cites as evidence: the one link between lessons and experiments.
  repeated string experiment_ids = 4;
  // The experiments in which the lesson helped, each listed once: how often it helped (spec
  // §8.6) is the list's length. Recording an experiment again changes nothing, so a restarted
  // lane cannot count it twice.
  repeated string helped_by = 5;
  // The experiments in which it hurt, each listed once: how often it hurt is the list's length.
  repeated string hurt_by = 6;
  // When the lesson was added.
  google.protobuf.Timestamp created_at = 7;
  // When it last changed, as when an experiment was added to helped_by or hurt_by.
  google.protobuf.Timestamp updated_at = 8;
  // When the lesson was deleted; absent while it stands. Readers and lessons.md skip a deleted
  // lesson. Its earlier lines stay in the file, so nothing is lost by accident.
  google.protobuf.Timestamp deleted_at = 9;
}

// Something that happened to a lane outside any one experiment (spec §8.6, §8.7): one line of
// lane_events.jsonl. The supervisor and the lanes append these; a restarted lane and the report
// read them back.
message LaneEvent {
  // The lane.
  Lane lane = 1;
  // When it happened.
  google.protobuf.Timestamp occurred_at = 2;
  // What happened.
  LaneEventKind kind = 3;
  // Details in words, such as how the lane crashed, the rule that stopped it, or why a
  // notification could not be delivered; may be empty.
  string detail = 4;
  // For LANE_EVENT_KIND_RESULTS_PR: the PR's number, which the ledger keeps so that a restarted
  // lane never opens a duplicate (spec §8.7); 0 for other kinds.
  int32 pr_number = 5;
  // For LANE_EVENT_KIND_RESULTS_PR: the PR's URL; empty for other kinds.
  string pr_url = 6;
  // For LANE_EVENT_KIND_RESULTS_PR: the commit at the head of the PR's rsi/<lane>/results-<n>
  // branch; empty for other kinds.
  string head_commit = 7;
  // For LANE_EVENT_KIND_RESULTS_PR: the accepted experiments whose changes the PR carries;
  // empty for other kinds.
  repeated string experiment_ids = 8;
  // For LANE_EVENT_KIND_NOTIFIED and LANE_EVENT_KIND_NOTIFY_FAILED: the text of the
  // notification, which never carries a secret or task data; empty for other kinds. It is kept
  // apart from detail, which holds a failed delivery's error, because the next results PR lists
  // every notification, delivered or not (spec §8.7).
  string notification = 9;
}

// What happened to a lane (spec §8.4, §8.7).
enum LaneEventKind {
  // Not set.
  LANE_EVENT_KIND_UNSPECIFIED = 0;
  // The lane started: the first time, or when a new goaly rsi run resumed it from the ledger,
  // as after the workspace stopped. The lane's time budget counts from its first start.
  LANE_EVENT_KIND_STARTED = 1;
  // The supervisor restarted the lane after it crashed; detail says how it crashed.
  LANE_EVENT_KIND_RESTARTED = 2;
  // The lane crashed too often for automatic recovery, so the supervisor stopped it and notified
  // the project lead.
  LANE_EVENT_KIND_RECOVERY_FAILED = 3;
  // The lane stopped by a stopping rule (spec §8.4); detail names the rule.
  LANE_EVENT_KIND_STOPPED = 4;
  // The lane opened a results PR.
  LANE_EVENT_KIND_RESULTS_PR = 5;
  // A notification was delivered to the ntfy topic.
  LANE_EVENT_KIND_NOTIFIED = 6;
  // A notification could not be delivered; it is retried.
  LANE_EVENT_KIND_NOTIFY_FAILED = 7;
}
