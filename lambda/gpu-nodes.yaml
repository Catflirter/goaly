budget_usd_per_hour: 3.0     # refuse any plan whose GPU nodes, at live hourly prices, add up to more than this
max_nodes: 3                 # total GPU node cap
pools:
  a6000:
    count: 1                 # target count in manual mode
    instance_type: gpu_1x_a6000
    fallback_types: [gpu_1x_a10, gpu_1x_a100]
    regions: [us-west-1, us-west-2, us-east-1]
    image_family: lambda-stack-22-04
    autoscale: {min: 1, max: 2, idle_minutes: 5}   # used only by the stretch autoscaler
