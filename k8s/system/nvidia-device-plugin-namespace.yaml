# Namespace for the NVIDIA device plugin Helm release (spec §4.3, §6.2 step 4). The cluster-wide PSA
# default is restricted; the device plugin DaemonSet needs hostPath mounts, so only this namespace
# enforces privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-device-plugin
  labels:
    pod-security.kubernetes.io/enforce: privileged
