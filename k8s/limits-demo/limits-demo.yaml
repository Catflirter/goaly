# Resource-limit demos (spec §7, check C7): oom exceeds its 64Mi memory limit and is OOMKilled
# (exit 137); cpu-burn spins in a shell loop and is throttled at its 100m CPU limit.
apiVersion: v1
kind: Namespace
metadata:
  name: limits-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: limits-demo
spec:
  # Never: the Pod stays Failed/OOMKilled for the check instead of crash-looping.
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: oom
      image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      # /dev/zero has no newline, so tail buffers it without bound until the cgroup OOM killer fires.
      command: ["tail", "/dev/zero"]
      resources:
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-burn
  namespace: limits-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: cpu-burn
      image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: ["sh", "-c", "while :; do :; done"]
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
