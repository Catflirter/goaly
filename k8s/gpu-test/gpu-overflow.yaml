# Check D6 (negative): asks for one more GPU while gpu-hold Pods occupy all of them, so it must stay
# Pending with "Insufficient nvidia.com/gpu".
# GPU wiring as in gpu-smoke.yaml: runtimeClassName nvidia-gpu plus one nvidia.com/gpu, no NVIDIA_VISIBLE_DEVICES.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-overflow
  namespace: gpu-test
spec:
  runtimeClassName: nvidia-gpu
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: cuda
      image: docker.io/nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
      command: ["sleep", "60"]
      resources:
        limits:
          nvidia.com/gpu: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
