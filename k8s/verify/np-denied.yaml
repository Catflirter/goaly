# Negative NetworkPolicy test (check C8): a client in a namespace other than nettest must not reach
# hello (curl exit 7: kube-router rejects; or 28: a policy that drops), while it does get HTTP 200
# from echo.nettest (the positive control, Ruling R45). The check applies this file and deletes the
# namespace afterwards.
apiVersion: v1
kind: Namespace
metadata:
  name: np-denied
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: np-denied
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: netshoot
      image: docker.io/nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
      command: ["sleep", "infinity"]
      resources:
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
