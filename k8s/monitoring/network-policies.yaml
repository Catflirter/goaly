# NetworkPolicies of the monitoring stack (spec §4.3: default-deny ingress plus explicit allows).
# Prometheus is the only client of the exporters, Grafana the only client of Prometheus. Nothing allows
# ingress to Grafana: the operator reaches it with kubectl port-forward, which enters the Pod's own
# network namespace through the kubelet and is not subject to NetworkPolicy. The same holds for
# `make prometheus`. The kubelet's probes come from the node itself and are allowed by k3s's policy
# controller, as for hello (k8s/hello/hello.yaml).
# The API server's Service proxy (kubectl get --raw .../services/prometheus:9090/proxy/...) is blocked by
# design: it comes from k3s-cp, not from the Pod's own node, and no rule admits it. Port-forward is the
# only way in (spec §10.0): `make prometheus` / `make grafana` use `scripts/monitoring.sh forward`, and
# check_s0_metrics (scripts/lib/checks.sh) opens its own `kubectl port-forward --address 127.0.0.1` (vr_bg,
# local ports VR_S0_PROM_PORT / VR_S0_GRAFANA_PORT). Do not add an allow rule for the cp.
# scripts/monitoring.sh applies this file together with namespaces.yaml, before any workload.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-kube-state-metrics
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring-host
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-node-exporter
  namespace: monitoring-host
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  policyTypes: [Ingress]
  ingress:
